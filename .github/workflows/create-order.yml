name: Create MAVRENX Order

on:
  workflow_dispatch:

jobs:
  create-order:
    runs-on: ubuntu-latest

    steps:
      - name: Install Firebase Admin
        run: |
          python3 -m pip install firebase-admin

      - name: Create secure MAVRENX order
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

        run: |
          python3 - <<'PY'
          import os
          import json
          import secrets
          from datetime import datetime, timezone

          import firebase_admin
          from firebase_admin import credentials, db


          service_account = json.loads(
              os.environ["FIREBASE_SERVICE_ACCOUNT"]
          )

          credential = credentials.Certificate(
              service_account
          )

          firebase_admin.initialize_app(
              credential,
              {
                  "databaseURL":
                  "https://mavrenxsecurity-default-rtdb.europe-west1.firebasedatabase.app"
              }
          )


          while True:

              order_id = (
                  "MAVRENX-" +
                  secrets.token_hex(6).upper()
              )

              order_ref = db.reference(
                  f"orders/{order_id}"
              )

              if order_ref.get() is None:
                  break


          tracking_ref = db.reference(
              f"tracking/{order_id}"
          )


          order_ref.set({
              "status": "Order received",
              "createdAt": datetime.now(
                  timezone.utc
              ).isoformat()
          })


          tracking_ref.set(
              "Order received"
          )


          print("")
          print("==============================")
          print("NEW MAVRENX ORDER")
          print("==============================")
          print(order_id)
          print("==============================")
          print("Status: Order received")
          print("")


          PY
