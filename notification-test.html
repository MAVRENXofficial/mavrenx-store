<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    MAVRENX Notification Test
  </title>
</head>


<body>

  <h1>
    MAVRENX Notification Test
  </h1>

  <p id="status">
    Ready.
  </p>

  <button
    id="send-test"
    type="button"
  >
    Send test notification
  </button>


  <script
    src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"
  ></script>

  <script
    src="https://www.gstatic.com/firebasejs/10.13.2/firebase-messaging-compat.js"
  ></script>


  <script>

    const firebaseConfig = {

      apiKey:
        "AIzaSyCSXAkvMhLGaJMBwGGY1SYqoDhulIMn5F4",

      authDomain:
        "mavrenxsecurity.firebaseapp.com",

      projectId:
        "mavrenxsecurity",

      storageBucket:
        "mavrenxsecurity.firebasestorage.app",

      messagingSenderId:
        "351069637181",

      appId:
        "1:351069637181:web:d204c4904017679506b854",

      measurementId:
        "G-MLY1MC2SDR"

    };


    const backendUrl =
      "https://mavrenx-checkout.matthewrizzwani.workers.dev";


    const statusText =
      document.getElementById(
        "status"
      );


    const button =
      document.getElementById(
        "send-test"
      );


    if (
      !firebase.apps.length
    ) {

      firebase.initializeApp(
        firebaseConfig
      );

    }


    const messaging =
      firebase.messaging();


    messaging.onMessage(
      async function(payload) {

        statusText.textContent =
          "Notification received successfully!";


        const title =
          payload.notification?.title ||
          "MAVRENX";


        const body =
          payload.notification?.body ||
          "Notification received.";


        try {

          const registration =
            await navigator
              .serviceWorker
              .ready;


          await registration
            .showNotification(
              title,
              {
                body:
                  body
              }
            );

        } catch (error) {

          console.error(
            error
          );

        }

      }
    );


    async function sendTestNotification() {

      button.disabled =
        true;


      statusText.textContent =
        "Sending test...";


      try {

        const token =
          localStorage.getItem(
            "mavrenx-notification-token"
          ) || "";


        if (
          !token
        ) {

          throw new Error(
            "No notification token found."
          );

        }


        if (
          !("Notification" in window) ||
          Notification.permission !==
            "granted"
        ) {

          throw new Error(
            "Notifications are not allowed."
          );

        }


        const registration =
          await navigator
            .serviceWorker
            .register(
              "./firebase-messaging-sw.js"
            );


        await navigator
          .serviceWorker
          .ready;


        const response =
          await fetch(
            backendUrl +
              "/test-notification",
            {

              method:
                "POST",

              headers: {

                "Content-Type":
                  "application/json"

              },


              body:
                JSON.stringify({

                  notificationToken:
                    token

                })

            }
          );


        const data =
          await response.json();


        if (
          !response.ok
        ) {

          throw new Error(
            data.details ||
            data.error ||
            "Test failed."
          );

        }


        statusText.textContent =
          "Test sent! Watch for the MAVRENX notification.";


      } catch (error) {

        console.error(
          error
        );


        statusText.textContent =
          "ERROR: " +
          error.message;

      }


      button.disabled =
        false;

    }


    button.addEventListener(
      "click",
      sendTestNotification
    );

  </script>

</body>

</html>
