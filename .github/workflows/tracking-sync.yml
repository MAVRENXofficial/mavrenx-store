name: MAVRENX Tracking Sync

on:
  workflow_dispatch:

  schedule:
    - cron: "*/10 * * * *"

jobs:
  sync-tracking:
    runs-on: ubuntu-latest

    steps:
      - name: Install packages
        run: |
          python3 -m pip install requests firebase-admin

      - name: Sync all MAVRENX shipments
        env:
          SHIP24_API_KEY: ${{ secrets.SHIP24_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

        run: |
          python3 - <<'PY'
          import os
          import json
          import requests
          import firebase_admin

          from firebase_admin import credentials
          from firebase_admin import db


          service_account = json.loads(
              os.environ["FIREBASE_SERVICE_ACCOUNT"]
          )

          credential = credentials.Certificate(
              service_account
          )

          firebase_admin.initialize_app(
              credential,
              {
                  "databaseURL":
                  "https://mavrenxsecurity-default-rtdb.europe-west1.firebasedatabase.app"
              }
          )


          shipments = db.reference(
              "shipments"
          ).get() or {}


          if not shipments:
              print("No shipments found.")
              raise SystemExit(0)


          ship24_api_key = os.environ[
              "SHIP24_API_KEY"
          ].strip()


          headers = {
              "Authorization":
                  "Bearer " + ship24_api_key,

              "Content-Type":
                  "application/json"
          }


          status_map = {
              "pending":
                  "Order confirmed with supplier",

              "info_received":
                  "Preparing",

              "in_transit":
                  "In transit",

              "out_for_delivery":
                  "Out for delivery",

              "available_for_pickup":
                  "Out for delivery",

              "delivered":
                  "Delivered",

              "failed_attempt":
                  "In transit",

              "exception":
                  "In transit"
          }


          for order_id, shipment_data in shipments.items():

              if not isinstance(
                  shipment_data,
                  dict
              ):
                  print(
                      f"{order_id}: invalid shipment data"
                  )
                  continue


              tracking_number = shipment_data.get(
                  "trackingNumber"
              )


              if not tracking_number:
                  print(
                      f"{order_id}: no tracking number"
                  )
                  continue


              print(
                  f"Checking {order_id}"
              )


              try:

                  response = requests.post(
                      "https://api.ship24.com/public/v1/trackers/track",

                      headers=headers,

                      json={
                          "trackingNumber":
                              tracking_number,

                          "clientTrackerId":
                              order_id
                      },

                      timeout=90
                  )


                  print(
                      f"{order_id}: Ship24 HTTP "
                      f"{response.status_code}"
                  )


                  response.raise_for_status()


                  data = response.json()


                  trackings = (
                      data
                      .get("data", {})
                      .get("trackings", [])
                  )


                  if not trackings:
                      print(
                          f"{order_id}: no tracking results"
                      )
                      continue


                  shipment = (
                      trackings[0]
                      .get("shipment", {})
                  )


                  ship24_status = shipment.get(
                      "statusMilestone"
                  )


                  if not ship24_status:
                      print(
                          f"{order_id}: no status milestone"
                      )
                      continue


                  mavrenx_status = status_map.get(
                      ship24_status,
                      "Shipped"
                  )


                  db.reference(
                      "tracking/" + order_id
                  ).set(
                      mavrenx_status
                  )


                  db.reference(
                      "orders/" + order_id
                  ).update({
                      "status": mavrenx_status
                  })


                  print(
                      f"{order_id}: "
                      f"{ship24_status} -> "
                      f"{mavrenx_status}"
                  )


              except Exception as error:

                  print(
                      f"{order_id}: ERROR: {error}"
                  )


          print(
              "MAVRENX tracking sync finished."
          )

          PY
